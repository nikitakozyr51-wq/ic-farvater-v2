name: Sync catalog from Strapi

# Робот синхронизации каталога: тянет данные из Strapi CMS, и ЕСЛИ контент
# реально изменился — пересобирает минифицированные ассеты и пушит в master.
# После commit/push этот же job явно вызывает защищённый HTTPS webhook новой Dokploy.
# GITHUB_TOKEN push не запускает новый Actions workflow; доставка не зависит от второго job.
# На schedule без изменений нет ни коммита, ни запроса новой сборки.

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/10 * * * *'    # каждые ~10 минут (GitHub может задерживать)
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Queue frontend deployment even when CMS content did not change'
        type: boolean
        default: false
        required: false

concurrency:
  group: sync-catalog
  cancel-in-progress: false

permissions:
  contents: write              # чтобы коммитить/пушить обновлённые данные

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Шаг 1а — генерация data-файлов каталога из Strapi (без зависимостей: только Node).
      # Пишет js/*-data.js только те, где данные реально изменились.
      - name: Generate catalog data from Strapi
        env:
          STRAPI_URL: https://cms.ic-farvater.ru
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          FRONTEND_JS_DIR: ${{ github.workspace }}/js
        run: node scripts/generate-data.js --write

      # Шаг 1б — инъекция текстов/картинок (single-types) в маркеры HTML.
      # Заменяет содержимое маркера только при непустом значении в Strapi,
      # иначе оставляет текущий HTML (fallback) — дизайн/вёрстка не меняются.
      - name: Inject content into HTML
        env:
          STRAPI_URL: https://cms.ic-farvater.ru
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          FRONTEND_DIR: ${{ github.workspace }}
        run: node scripts/inject-html.js --write

      # Шаг 1в — статические страницы каталога (подход A): категории/варианты/товары
      # из только что обновлённых js/*-data.js + sitemap. Байт-стабилен: без правок
      # в данных ничего не переписывает → diff-детектор ниже не срабатывает зря.
      - name: Generate catalog pages
        run: node scripts/generate-catalog-pages.mjs

      # Шаг 2 — есть ли изменения? Если нет — на этом всё (сайт не трогаем).
      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Каталог изменился:"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Изменений нет — сборку и пуш пропускаем."
          fi

      # Шаг 3 — только при изменениях: ставим деп, пересобираем минифицированные
      # ассеты (то же что npm run build локально), коммитим и пушим.
      - name: Install deps & rebuild minified assets
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "ic-farvater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "data: sync from Strapi"
          git push

      # Queue only: Dokploy performs the build and rolling service update.
      # The initial recovery release verifies the resulting commit/image on the VPS.
      - name: Queue frontend deployment on the restored VPS
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'push' || inputs.force_deploy == true
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo '::error::Frontend deployment secret is missing.'
            exit 1
          fi
          export DEPLOY_COMMIT="$(git rev-parse HEAD)"
          node <<'NODE'
          const fs = require('node:fs');
          const payload = {
            ref: 'refs/heads/' + process.env.GITHUB_REF_NAME,
            head_commit: {
              id: process.env.DEPLOY_COMMIT,
              message: 'Frontend deployment after CMS synchronization',
            },
            commits: [],
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/ic-frontend-deploy.json', JSON.stringify(payload));
          NODE
          http_status="$(curl --silent --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/ic-frontend-deploy-response.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --header 'X-GitHub-Event: push' \
            --data-binary "@$RUNNER_TEMP/ic-frontend-deploy.json" "$DOKPLOY_DEPLOY_WEBHOOK")"
          if [ "$http_status" != '200' ]; then
            echo "::error::Frontend deployment request was not accepted (HTTP $http_status)."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/ic-frontend-deploy-response.json', 'utf8'));
          if (result.message !== 'Application deployed successfully') throw new Error('Unexpected deployment acknowledgement');
          console.log('Frontend deployment queued; Dokploy tracks build and rollout status.');
          NODE
